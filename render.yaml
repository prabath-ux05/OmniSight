# =============================================================================
# OmniSight — Render Infrastructure as Code (Blueprint Specification)
#
# Defines the production FastAPI web service, managed PostgreSQL database,
# persistent artifact storage disk, and build/deploy lifecycle hooks.
# Reference: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  - type: web
    name: omnisight-backend
    runtime: docker
    plan: starter
    region: oregon
    autoDeploy: true

    # Docker build configuration: uses repository root Dockerfile based on official Playwright image
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Health check probe: Render verifies HTTP 200 before routing live traffic
    healthCheckPath: /health

    # Persistent disk for inspection screenshots, DOM snapshots, and artifacts
    disk:
      name: omnisight-artifacts
      mountPath: /app/artifacts
      sizeGB: 10

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      # Internal PostgreSQL connection string provided by the attached Render database
      - key: DATABASE_URL
        fromDatabase:
          name: omnisight-db
          property: connectionString

      # CSRF signing key: auto-generated cryptographically secure 256-bit secret (>= 32 chars)
      - key: CSRF_SECRET_KEY
        generateValue: true

      # Trusted CORS & Origin validation: prompt user on initial Blueprint deployment
      # Set to the public frontend domain (e.g., https://app.yourdomain.com)
      - key: CORS_ORIGINS
        sync: false

      # Uvicorn trusted proxy IPs: trusts Render edge proxies forwarding requests
      - key: FORWARDED_ALLOW_IPS
        value: "*"

      # Security cookie policy (enforces Secure flag in production)
      - key: COOKIE_SECURE
        value: "true"

      - key: COOKIE_SAMESITE
        value: lax

      # AI & Vision engine settings (set by user in Render Dashboard)
      - key: VISION_MODEL_PROVIDER
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: omnisight-db
    databaseName: omnisight_db
    user: omnisight_user
    plan: starter
    region: oregon

